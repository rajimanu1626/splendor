# Splendor Online – nginx config for splendor.r4j.co.in
# Next.js on :3000, Socket.IO game server on :3001.
# Install: sudo cp nginx/splendor.r4j.co.in.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/splendor.r4j.co.in.conf /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d splendor.r4j.co.in

# HTTP → redirect to HTTPS (uncomment after enabling SSL)
# server {
#     listen 80;
#     server_name splendor.r4j.co.in;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    server_name splendor.r4j.co.in;

    # Optional: uncomment and set after enabling SSL with certbot
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/splendor.r4j.co.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/splendor.r4j.co.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Next.js (client)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO (game server) – WebSocket upgrade + long timeouts
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

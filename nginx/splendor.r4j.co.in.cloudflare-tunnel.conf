# Splendor Online – nginx config when SSL is handled by Cloudflare Tunnel
# Cloudflare Tunnel (cloudflared) terminates HTTPS and forwards to this server.
# Configure your tunnel to forward to http://localhost:80 (or the port below).
#
# Install: sudo cp nginx/splendor.r4j.co.in.cloudflare-tunnel.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/splendor.r4j.co.in.cloudflare-tunnel.conf /etc/nginx/sites-enabled/
#          (disable or remove the non-tunnel config if you had one for this host)

server {
    listen 127.0.0.1:80;
    server_name splendor.r4j.co.in;

    # No SSL here – Cloudflare handles HTTPS. Tunnel forwards plain HTTP to this port.
    # Cloudflare Tunnel sends X-Forwarded-Proto (https) and X-Forwarded-For; we pass them to the app.

    # Next.js (client)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO (game server) – WebSocket upgrade + long timeouts
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
